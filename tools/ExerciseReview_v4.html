<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise Review</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d0d0d; color: #f0f0f0; font-family: system-ui, sans-serif; }
.header { background: #161616; border-bottom: 1px solid #252525; padding: 14px 20px; position: sticky; top: 0; z-index: 100; }
.header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.title { font-size: 1.3rem; font-weight: 700; color: #c8ff00; letter-spacing: 0.05em; flex: 1; }
.counter { font-size: 0.75rem; color: #999; }
.progress-wrap { height: 4px; background: #252525; border-radius: 2px; }
.progress-fill { height: 4px; background: #c8ff00; border-radius: 2px; width: 0%; transition: width 0.3s; }
.filters { background: #161616; border-bottom: 1px solid #252525; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.flabel { font-size: 0.65rem; color: #666; text-transform: uppercase; letter-spacing: 0.1em; margin-right: 2px; }
.fb { padding: 5px 11px; border-radius: 20px; border: 1px solid #2a2a2a; background: #1a1a1a; color: #888; font-size: 0.72rem; cursor: pointer; }
.fb.on { background: #c8ff00; color: #0d0d0d; border-color: #c8ff00; font-weight: 700; }
.search { flex: 1; min-width: 140px; padding: 6px 12px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; color: #f0f0f0; font-size: 0.8rem; outline: none; }
.search:focus { border-color: #c8ff00; }
.card { background: #161616; border: 1px solid #252525; border-radius: 12px; margin: 10px 14px; overflow: hidden; }
.card.s-keep     { border-color: #34c759; }
.card.s-edit     { border-color: #ff9500; }
.card.s-delete   { border-color: #ff3b30; }
.card.s-dupe     { border-color: #af52de; }
.card.hidden     { display: none; }
.imgs { display: flex; }
.img-col { flex: 1; display: flex; flex-direction: column; }
.img-lbl { font-size: 0.58rem; color: #666; text-transform: uppercase; letter-spacing: 0.12em; padding: 3px 8px; background: #111; }
.ex-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #1a1a1a; }
.no-img { width: 100%; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; background: #111; color: #444; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; }
.body { padding: 12px 14px; }
.exname { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.exnum { font-size: 0.62rem; color: #555; font-family: monospace; }
.badge-exact { font-size: 0.62rem; padding: 2px 7px; border-radius: 10px; background: rgba(255,59,48,0.15); color: #ff3b30; border: 1px solid rgba(255,59,48,0.3); }
.dupe-warn { background: rgba(175,82,222,0.08); border: 1px solid rgba(175,82,222,0.25); border-radius: 7px; padding: 6px 10px; margin: 6px 0; font-size: 0.72rem; color: #af52de; }
.meta { display: flex; flex-direction: column; gap: 4px; margin: 8px 0; }
.meta-row { display: flex; gap: 8px; font-size: 0.73rem; }
.mlabel { color: #c8ff00; font-weight: 600; min-width: 70px; flex-shrink: 0; }
.mval { color: #bbb; line-height: 1.4; }
.desc { font-size: 0.77rem; color: #888; line-height: 1.5; margin-bottom: 10px; font-style: italic; }
.btns { display: grid; grid-template-columns: repeat(4,1fr); gap: 5px; }
.ab { padding: 8px 2px; border-radius: 7px; border: 1.5px solid #2a2a2a; background: #1a1a1a; color: #777; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; text-align: center; }
.ab:hover { color: #f0f0f0; border-color: #555; }
.ab.on-keep   { background: rgba(52,199,89,0.15);  border-color: #34c759; color: #34c759; }
.ab.on-edit   { background: rgba(255,149,0,0.15);  border-color: #ff9500; color: #ff9500; }
.ab.on-delete { background: rgba(255,59,48,0.15);  border-color: #ff3b30; color: #ff3b30; }
.ab.on-dupe   { background: rgba(175,82,222,0.15); border-color: #af52de; color: #af52de; }
.note { width: 100%; margin-top: 7px; background: #111; border: 1px solid #252525; border-radius: 7px; padding: 7px 10px; color: #ccc; font-size: 0.76rem; outline: none; resize: none; display: none; font-family: inherit; }
.note.show { display: block; }
.footer { background: #161616; border-top: 1px solid #252525; padding: 12px 16px; position: sticky; bottom: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; font-size: 0.72rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.d-keep { background: #34c759; } .d-edit { background: #ff9500; } .d-delete { background: #ff3b30; } .d-dupe { background: #af52de; } .d-un { background: #555; }
.exp-btn { padding: 10px 18px; background: #c8ff00; color: #0d0d0d; border: none; border-radius: 9px; font-weight: 700; font-size: 0.8rem; cursor: pointer; letter-spacing: 0.04em; }
.empty { text-align: center; padding: 50px 20px; color: #555; font-size: 0.85rem; display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div class="title">Exercise Review</div>
    <div class="counter" id="ctr">0 / 252 reviewed</div>
  </div>
  <div class="progress-wrap"><div class="progress-fill" id="prog"></div></div>
</div>

<div class="filters">
  <span class="flabel">Filter:</span>
  <button class="fb on" data-f="all">All (252)</button>
  <button class="fb" data-f="unreviewed">Unreviewed</button>
  <button class="fb" data-f="no-image">No image (88)</button>
  <button class="fb" data-f="dupe-warn">⚠ Similar names</button>
  <button class="fb" data-f="edit">Flagged: Edit</button>
  <button class="fb" data-f="delete">Flagged: Delete</button>
  <input class="search" id="srch" placeholder="Search exercises..." type="search">
</div>

<div id="list"></div>
<div class="empty" id="empty">No exercises match.</div>

<div class="footer">
  <div class="stats">
    <span><span class="dot d-keep"></span><span id="s-keep">0</span> keep</span>
    <span><span class="dot d-edit"></span><span id="s-edit">0</span> edit</span>
    <span><span class="dot d-delete"></span><span id="s-del">0</span> delete</span>
    <span><span class="dot d-dupe"></span><span id="s-dupe">0</span> dupe</span>
    <span><span class="dot d-un"></span><span id="s-un">252</span> unreviewed</span>
  </div>
  <button class="exp-btn" id="expbtn">Export JSON</button>
  <button class="exp-btn" id="resetbtn" style="background:#1a1a1a;color:#ff3b30;border:1px solid #ff3b30;">Reset</button>
</div>

<script>
var EX = [];
var DUPES = [];
var state = [];
var curFilter = 'all';
var curSearch = '';

var STORAGE_KEY = 'ex-review-state';

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

function loadState() {
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      var parsed = JSON.parse(saved);
      if (parsed.length === EX.length) return parsed;
    }
  } catch(e) {}
  return null;
}

function clearState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  for (var i = 0; i < state.length; i++) state[i] = { flag: null, note: '' };
  renderAll();
}

function init(exercises, dupes) {
  EX = exercises;
  DUPES = dupes;
  for (var i = 0; i < EX.length; i++) {
    state.push({ flag: null, note: '' });
  }
  // Restore saved state if length matches
  var saved = loadState();
  if (saved) {
    state = saved;
    console.log('Restored saved state');
  }

  // Build dupe lookup
  window.dupeMap = {};
  for (var d = 0; d < DUPES.length; d++) {
    var a = DUPES[d][0], b = DUPES[d][1], r = DUPES[d][2];
    if (!dupeMap[a]) dupeMap[a] = [];
    if (!dupeMap[b]) dupeMap[b] = [];
    dupeMap[a].push({ other: b, reason: r });
    dupeMap[b].push({ other: a, reason: r });
  }

  renderAll();
}

function renderAll() {
  var list = document.getElementById('list');
  var frag = document.createDocumentFragment();

  for (var i = 0; i < EX.length; i++) {
    frag.appendChild(makeCard(i));
  }

  list.innerHTML = '';
  list.appendChild(frag);
  applyFilter();
  updateStats();
}

function makeCard(i) {
  var ex = EX[i];
  var s = state[i];
  var dupes = dupeMap[ex.name] || [];
  var isExact = dupes.some(function(d) { return d.reason === 'exact-normalised'; });

  var card = document.createElement('div');
  card.className = 'card' + (s.flag ? ' s-' + s.flag : '');
  card.dataset.idx = i;
  card.dataset.flag = s.flag || '';
  card.dataset.hasImg = ex.has_img ? '1' : '0';
  card.dataset.hasDupe = dupes.length > 0 ? '1' : '0';
  card.dataset.name = ex.name.toLowerCase();

  // Images
  var imgsDiv = document.createElement('div');
  imgsDiv.className = 'imgs';
  imgsDiv.appendChild(makeImgCol(ex.img1, 'Start'));
  imgsDiv.appendChild(makeImgCol(ex.img2, 'End'));
  card.appendChild(imgsDiv);

  // Body
  var body = document.createElement('div');
  body.className = 'body';

  var nameDiv = document.createElement('div');
  nameDiv.className = 'exname';
  nameDiv.appendChild(document.createTextNode(ex.name + ' '));
  var numSpan = document.createElement('span');
  numSpan.className = 'exnum';
  numSpan.textContent = '#' + (i + 1);
  nameDiv.appendChild(numSpan);
  if (isExact) {
    var badge = document.createElement('span');
    badge.className = 'badge-exact';
    badge.textContent = 'EXACT DUPLICATE';
    nameDiv.appendChild(badge);
  }
  body.appendChild(nameDiv);

  if (dupes.length > 0) {
    var warn = document.createElement('div');
    warn.className = 'dupe-warn';
    var others = dupes.map(function(d) { return d.other; }).join(', ');
    warn.textContent = '\u26a0 Similar to: ' + others;
    body.appendChild(warn);
  }

  var meta = document.createElement('div');
  meta.className = 'meta';
  meta.appendChild(metaRow('Muscles', ex.muscles));
  meta.appendChild(metaRow('Tags', ex.tags));
  meta.appendChild(metaRow('Equipment', ex.equipment));
  body.appendChild(meta);

  if (ex.desc) {
    var descDiv = document.createElement('div');
    descDiv.className = 'desc';
    descDiv.textContent = ex.desc.substring(0, 220) + (ex.desc.length > 220 ? '\u2026' : '');
    body.appendChild(descDiv);
  }

  // Action buttons
  var btns = document.createElement('div');
  btns.className = 'btns';
  ['keep','edit','delete','dupe'].forEach(function(f) {
    var labels = { keep: '\u2713 Keep', edit: '\u270f Edit', delete: '\ud83d\uddd1 Delete', dupe: '\u29c8 Dupe' };
    var btn = document.createElement('button');
    btn.className = 'ab' + (s.flag === f ? ' on-' + f : '');
    btn.textContent = labels[f];
    btn.onclick = (function(idx, flag) {
      return function() { setFlag(idx, flag); };
    })(i, f);
    btns.appendChild(btn);
  });
  body.appendChild(btns);

  var note = document.createElement('textarea');
  note.className = 'note' + (s.note || s.flag === 'edit' || s.flag === 'delete' || s.flag === 'dupe' ? ' show' : '');
  note.id = 'note-' + i;
  note.placeholder = 'Notes (what to change, which duplicate to keep...)';
  note.rows = 2;
  note.value = s.note;
  note.onchange = (function(idx) {
    return function(e) { state[idx].note = e.target.value; saveState(); };
  })(i);
  body.appendChild(note);

  card.appendChild(body);
  return card;
}

function makeImgCol(url, label) {
  var col = document.createElement('div');
  col.className = 'img-col';
  var lbl = document.createElement('div');
  lbl.className = 'img-lbl';
  lbl.textContent = label;
  col.appendChild(lbl);
  if (url) {
    var img = document.createElement('img');
    img.className = 'ex-img';
    img.loading = 'lazy';
    img.src = url;
    img.onerror = function() {
      var ph = document.createElement('div');
      ph.className = 'no-img';
      ph.textContent = 'IMG ERROR';
      this.parentNode.replaceChild(ph, this);
    };
    col.appendChild(img);
  } else {
    var ph = document.createElement('div');
    ph.className = 'no-img';
    ph.textContent = 'No image';
    col.appendChild(ph);
  }
  return col;
}

function metaRow(label, val) {
  var row = document.createElement('div');
  row.className = 'meta-row';
  var l = document.createElement('span');
  l.className = 'mlabel';
  l.textContent = label;
  var v = document.createElement('span');
  v.className = 'mval';
  v.textContent = val || '-';
  row.appendChild(l);
  row.appendChild(v);
  return row;
}

function setFlag(idx, flag) {
  var s = state[idx];
  s.flag = s.flag === flag ? null : flag;

  var card = document.querySelector('.card[data-idx="' + idx + '"]');
  card.className = 'card' + (s.flag ? ' s-' + s.flag : '');
  card.dataset.flag = s.flag || '';

  var btns = card.querySelectorAll('.ab');
  var flags = ['keep','edit','delete','dupe'];
  for (var b = 0; b < btns.length; b++) {
    btns[b].className = 'ab' + (s.flag === flags[b] ? ' on-' + flags[b] : '');
  }

  var note = document.getElementById('note-' + idx);
  if (s.flag === 'edit' || s.flag === 'delete' || s.flag === 'dupe') {
    note.classList.add('show');
  } else if (!s.note) {
    note.classList.remove('show');
  }

  applyFilter();
  updateStats();
}

function applyFilter() {
  var cards = document.querySelectorAll('.card');
  var visible = 0;
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var flag = card.dataset.flag;
    var hasImg = card.dataset.hasImg === '1';
    var hasDupe = card.dataset.hasDupe === '1';
    var name = card.dataset.name;
    var show = true;

    if (curSearch && name.indexOf(curSearch) === -1) show = false;

    if (show) {
      if (curFilter === 'unreviewed') show = !flag;
      else if (curFilter === 'no-image') show = !hasImg;
      else if (curFilter === 'dupe-warn') show = hasDupe;
      else if (curFilter === 'edit') show = flag === 'edit';
      else if (curFilter === 'delete') show = flag === 'delete';
    }

    card.classList.toggle('hidden', !show);
    if (show) visible++;
  }
  document.getElementById('empty').style.display = visible === 0 ? 'block' : 'none';
}

function updateStats() {
  var counts = { keep: 0, edit: 0, delete: 0, dupe: 0, un: 0 };
  for (var i = 0; i < state.length; i++) {
    var f = state[i].flag;
    if (f === 'keep') counts.keep++;
    else if (f === 'edit') counts.edit++;
    else if (f === 'delete') counts.delete++;
    else if (f === 'dupe') counts.dupe++;
    else counts.un++;
  }
  var reviewed = EX.length - counts.un;
  document.getElementById('ctr').textContent = reviewed + ' / ' + EX.length + ' reviewed';
  document.getElementById('prog').style.width = Math.round(reviewed / EX.length * 100) + '%';
  document.getElementById('s-keep').textContent = counts.keep;
  document.getElementById('s-edit').textContent = counts.edit;
  document.getElementById('s-del').textContent = counts.delete;
  document.getElementById('s-dupe').textContent = counts.dupe;
  document.getElementById('s-un').textContent = counts.un;
}

// Filter buttons
document.querySelectorAll('.fb').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.fb').forEach(function(b) { b.classList.remove('on'); });
    btn.classList.add('on');
    curFilter = btn.dataset.f;
    applyFilter();
  });
});

// Search
document.getElementById('srch').addEventListener('input', function(e) {
  curSearch = e.target.value.trim().toLowerCase();
  applyFilter();
});

// Export
document.getElementById('expbtn').addEventListener('click', function() {
  var result = { keep: [], edit: [], delete: [], dupe: [], unreviewed: [] };
  for (var i = 0; i < EX.length; i++) {
    var ex = EX[i];
    var s = state[i];
    var entry = { id: i + 1, name: ex.name, muscles: ex.muscles, tags: ex.tags, equipment: ex.equipment, has_image: ex.has_img, note: s.note };
    var bucket = s.flag || 'unreviewed';
    if (bucket === 'dupe') bucket = 'dupe';
    result[bucket].push(entry);
  }
  var json = JSON.stringify(result, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'exercise-review.json'; a.click();
  URL.revokeObjectURL(url);
});

// Reset button
document.getElementById('resetbtn').addEventListener('click', function() {
  if (confirm('Reset all flags and notes? This cannot be undone.')) clearState();
});

// Boot
